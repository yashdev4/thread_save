[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thread-save-mcp"
version = "0.1.0"
description = "MCP server that persists conversation threads to structured Markdown files"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "cryptography>=42.0.0",
    "asyncpg>=0.29.0",
    "ulid-py>=1.1.0",
    "pyjwt>=2.8.0",
]

[project.scripts]
thread-save = "thread_save.server:main"
thread-save-migrate = "thread_save.cli.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thread_save"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: live integration tests against external APIs",
]


