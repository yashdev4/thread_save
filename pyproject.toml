[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thread-save-mcp"
version = "0.1.0"
description = "MCP server that persists conversation threads to structured Markdown files"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0",
]

[project.scripts]
thread-save = "thread_save.server:main"
thread-save-migrate = "thread_save.cli.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thread_save"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

