# Render Blueprint for ThreadVault Remote MCP Server (Native Python runtime - No Docker)

services:
  - type: web
    name: threadvault-web
    runtime: python
    region: ohio # US East - low latency to Anthropic infrastructure
    plan: starter # Starter tier prevents cold start spin-downs
    buildCommand: pip install -r requirements.txt && pip install .
    startCommand: uvicorn thread_save.web.app:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    disk:
      name: threadvault-data
      mountPath: /data/vault
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: THREADVAULT_STORAGE_BACKEND
        value: file
      - key: THREADVAULT_ROOT
        value: /data/vault
      - key: THREADVAULT_AUTH_PAUSED
        value: "true"
      - key: THREADVAULT_ENFORCE_AUTH
        value: "false"
      - key: THREADVAULT_GH_REPO
        value: "https://github.com/yashdev4/thread_vault.git"
      - key: THREADVAULT_SYNC_INTERVAL_SECONDS
        value: "60"
      - key: THREADVAULT_ALLOWED_HOSTS
        value: "*"
      - key: GITHUB_TOKEN
        sync: false # Input your GitHub PAT in Render dashboard to sync threads to thread_vault
